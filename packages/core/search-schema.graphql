type OrganizationReference {
  id: IRI!
  label: [LanguageString!]!
}

"""
An absolute IRI (RFC 3987), serialized as a string. Any scheme – `https:`, `urn:`, `doi:`, `ark:` – not only HTTP. A field or filter typed `IRI` keys on identity, never on a literal.
"""
scalar IRI @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3987")

type LanguageString {
  language: String
  value: String!
}

type TerminologySourceReference {
  id: IRI!
  label: [LanguageString!]!
}

type Query {
  datasets(
    """
    Free-text query. Omit it to browse by filter alone.
    """
    query: String

    """
    Conditions every result must satisfy.
    """
    where: DatasetWhere

    """
    Sort order. Defaults to relevance for a free-text query.
    """
    orderBy: DatasetOrderBy

    """
    1-based page number; at least 1.
    """
    page: Int = 1

    """
    Results per page, between 0 and 100. Use 0 for a facet-only query: no results are fetched, and the facet counts still come back.
    """
    perPage: Int = 20
  ): DatasetSearchResult!
  organizations(
    """
    Free-text query. Omit it to browse by filter alone.
    """
    query: String

    """
    Conditions every result must satisfy.
    """
    where: OrganizationWhere

    """
    Sort order. Defaults to relevance for a free-text query.
    """
    orderBy: OrganizationOrderBy

    """
    1-based page number; at least 1.
    """
    page: Int = 1

    """
    Results per page, between 0 and 100. Use 0 for a facet-only query: no results are fetched, and the facet counts still come back.
    """
    perPage: Int = 20
  ): OrganizationSearchResult!
  classs(
    """
    Free-text query. Omit it to browse by filter alone.
    """
    query: String

    """
    Conditions every result must satisfy.
    """
    where: ClassWhere

    """
    Sort order. Defaults to relevance for a free-text query.
    """
    orderBy: ClassOrderBy

    """
    1-based page number; at least 1.
    """
    page: Int = 1

    """
    Results per page, between 0 and 100. Use 0 for a facet-only query: no results are fetched, and the facet counts still come back.
    """
    perPage: Int = 20
  ): ClassSearchResult!
  terminologySources(
    """
    Free-text query. Omit it to browse by filter alone.
    """
    query: String

    """
    Conditions every result must satisfy.
    """
    where: TerminologySourceWhere

    """
    Sort order. Defaults to relevance for a free-text query.
    """
    orderBy: TerminologySourceOrderBy

    """
    1-based page number; at least 1.
    """
    page: Int = 1

    """
    Results per page, between 0 and 100. Use 0 for a facet-only query: no results are fetched, and the facet counts still come back.
    """
    perPage: Int = 20
  ): TerminologySourceSearchResult!
}

type DatasetSearchResult {
  items: [Dataset!]!
  pagination: Pagination!
  facets: DatasetFacets!
}

type Dataset {
  id: IRI!
  title: [LanguageString!]!
  description: [LanguageString!]!
  publisher: [OrganizationReference!]!
  terminology_source: [TerminologySourceReference!]!
  language: [String!]!
  format: [String!]!
  date_posted: String
  size: Int
  status: String!
  iiif_manifest_count: Int
  iiif: Boolean!
  nde_schema_ap: Boolean!
}

type Pagination {
  total: Int!
  page: Int!
  perPage: Int!
}

type DatasetFacets {
  publisher: [IRIBucket!]!
  class: [IRIBucket!]!
  terminology_source: [IRIBucket!]!
  language: [ValueBucket!]!
  format: [ValueBucket!]!
  size: IntBinnedRangeFacet!
  status: [ValueBucket!]!
  iiif: [BooleanBucket!]!
  nde_schema_ap: [BooleanBucket!]!
  linked_data: [BooleanBucket!]!
  terms: [BooleanBucket!]!
  persistent_uris: [BooleanBucket!]!
}

type IRIBucket {
  value: IRI!
  count: Int!
  label: [LanguageString!]
}

type ValueBucket {
  value: String!
  count: Int!
  label: [LanguageString!]
}

type IntBinnedRangeFacet {
  """
  The lowest and highest value in the whole collection, ignoring every filter and the text of the query; null when no document holds one.
  """
  all: IntExtent

  """
  The lowest and highest value among the documents every other filter leaves – the field’s own range filter is not applied, so a selection can always be widened again; null when none holds one.
  """
  matching: IntExtent

  """
  The declared bins over the same documents as “matching”.
  """
  buckets: [RangeBucket!]!
}

type IntExtent {
  min: Int!
  max: Int!
}

type RangeBucket {
  min: Float
  max: Float
  count: Int!
}

type BooleanBucket {
  value: Boolean!
  count: Int!
}

"""
Sibling keys are combined with AND. Use `or` for a disjunction, and `and` when a query needs more than one of them.
"""
input DatasetWhere {
  id: DatasetFilter
  publisher: OrganizationFilter
  catalog: IRIFilter
  class: IRIFilter
  terminology_source: TerminologySourceFilter
  format: KeywordFilter
  size: IntRange
  status: KeywordFilter
  nde_schema_ap: Boolean

  """
  A disjunction: a document matches when ANY of these criteria holds. Combined with the sibling keys by AND, so it widens across fields without widening the query as a whole.
  """
  or: [DatasetCriterion!]

  """
  Further groups of conditions, all of which apply. The way to carry a second `or` disjunction alongside the first.
  """
  and: [DatasetWhere!]
}

"""
Matches a field holding IRIs of Dataset.
"""
input DatasetFilter {
  in: [IRI!]
}

"""
Matches a field holding IRIs of Organization.
"""
input OrganizationFilter {
  in: [IRI!]
}

"""
Matches a field holding IRIs that belong to no collection this API serves.
"""
input IRIFilter {
  in: [IRI!]
}

"""
Matches a field holding IRIs of TerminologySource.
"""
input TerminologySourceFilter {
  in: [IRI!]
}

"""
Matches a field holding literal values.
"""
input KeywordFilter {
  in: [String!]
}

input IntRange {
  min: Int
  max: Int
}

"""
A condition on exactly one field. Used inside `or`, where the criteria are alternatives.
"""
input DatasetCriterion @oneOf {
  id: DatasetFilter
  publisher: OrganizationFilter
  catalog: IRIFilter
  class: IRIFilter
  terminology_source: TerminologySourceFilter
  format: KeywordFilter
  size: IntRange
  status: KeywordFilter
  nde_schema_ap: Boolean
}

input DatasetOrderBy {
  field: DatasetSortField!
  direction: SortDirection! = DESC
}

enum DatasetSortField {
  RELEVANCE
  TITLE
  DATE_POSTED
  SIZE
  STATUS_RANK
}

enum SortDirection {
  ASC
  DESC
}

