name: QA

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NX_VERBOSE_LOGGING: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v5

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      # docker:smoke runs each freshly built image and asserts it reaches startup,
      # so a runtime-only failure (e.g. a runtime dep missing from the pruned image,
      # surfacing as ERR_MODULE_NOT_FOUND at boot) is caught here rather than in
      # production – docker:build alone only builds, it never runs the image (#2128).
      - run: npx nx affected -t lint test typecheck check build docker:build docker:smoke

      # Only set up Playwright when a project that owns an e2e target is actually
      # affected, so config-only PRs do not pay for (or flake on) a browser download
      # they do not need.
      - name: Check whether E2E tests are affected
        id: e2e
        run: |
          if [ -n "$(npx nx show projects --affected -t e2e)" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      # npx playwright install --with-deps is the install method Playwright recommends
      # for CI (it also advises against caching browser binaries). The download stalls
      # intermittently and has no timeout of its own, which used to wedge the job for
      # hours, so bound each attempt and retry to fail fast and recover.
      - name: Install Playwright browsers
        if: steps.e2e.outputs.affected == 'true'
        working-directory: apps/browser
        run: |
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} failed or timed out after 300s; retrying"
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - name: Run E2E tests
        if: steps.e2e.outputs.affected == 'true'
        run: npx nx affected -t e2e

  # The GraphQL surface consumers query is generated from SEARCH_SCHEMA by
  # @lde/search-api-graphql, so nothing in the repository states it and the
  # declaration tests cannot see what the generator turns them into. This job
  # regenerates the committed contract and commits any drift to the branch, so a
  # pull request that moves the published API shows the move in Files changed.
  # See docs/graphql-contract.md.
  graphql-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The head branch, not the merge ref, because this job pushes to it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Skip changes that cannot move the GraphQL surface.
      - id: relevant
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- \
               packages/core/src/search package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing here can change the GraphQL surface.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.relevant.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - if: steps.relevant.outputs.changed == 'true'
        run: npm ci

      - if: steps.relevant.outputs.changed == 'true'
        run: npx nx run @dataset-register/core:sdl

      - if: steps.relevant.outputs.changed == 'true'
        name: Commit if the contract was out of date
        env:
          CONTRACT: packages/core/search-schema.graphql
        run: |
          set -euo pipefail
          if git diff --quiet -- "$CONTRACT"; then
            echo 'The committed contract is already current.'
            exit 0
          fi
          echo 'The committed contract was out of date:'
          git --no-pager diff -- "$CONTRACT"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$CONTRACT"
          # --no-verify: the pre-commit hook runs `nx affected`, which defaults to
          # --base=main, and this checkout has only the head branch.
          git commit --no-verify -m 'build(core): update the GraphQL contract'
          git push origin "HEAD:${{ github.head_ref }}"

      # Whether this pull request changes the API, which is a different question
      # from whether the file needed regenerating: an author who ran the target
      # themselves leaves nothing for the step above to do, and their change would
      # go unlabelled. Compare the committed surfaces instead, now that this
      # branch's is known current.
      - if: steps.relevant.outputs.changed == 'true'
        id: surface
        name: Does this change the published API?
        env:
          CONTRACT: packages/core/search-schema.graphql
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${{ github.base_ref }}" -- "$CONTRACT"; then
            echo 'moved=false' >> "$GITHUB_OUTPUT"
            echo 'No change to the published GraphQL surface.'
          else
            echo 'moved=true' >> "$GITHUB_OUTPUT"
            echo 'This changes the published GraphQL surface:'
            git --no-pager diff "origin/${{ github.base_ref }}" -- "$CONTRACT"
          fi

      # Visible in a listing without opening the pull request, and removed again
      # if a later push takes the change back out - so the label always states
      # what the branch currently does.
      - if: steps.relevant.outputs.changed == 'true'
        name: Label the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: graphql-schema-change
          MOVED: ${{ steps.surface.outputs.moved }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          gh label create "$LABEL" --color 1d76db \
            --description 'Changes the published GraphQL surface consumers query' \
            2>/dev/null || true
          if [ "$MOVED" = 'true' ]; then
            action=--add-label
          else
            action=--remove-label
          fi
          # Retry: the label is a signal, and a GitHub blip is not news about
          # this branch. #2320 went red purely because `gh pr edit` met a 503
          # during an API incident, minutes after the contract itself had been
          # written and found current.
          for attempt in 1 2 3; do
            if gh pr edit "$PR" "$action" "$LABEL"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          # Warn rather than fail. The committed contract is the substance of
          # this job and it is already correct by here; a job that goes red on a
          # transient API error teaches everyone to ignore it, which costs more
          # than a stale label.
          echo "::warning::Could not ${action#--} ${LABEL} on #${PR}; the committed contract is unaffected."
