name: Publish Requirements

on:
  push:
    branches:
      - main
    paths:
      - 'requirements/**'
  pull_request:
    branches:
      - main
    paths:
      - 'requirements/**'

defaults:
  run:
    working-directory: requirements

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Renders the templates and adds the NDE logo and house style; requirements/Makefile
      # reads this version, so a local build matches.
      - uses: netwerk-digitaal-erfgoed/workflows/spec-boilerplate@babc5aa5ed679c7c875c55f1b956758ecfbd0aa0
        with:
          working-directory: requirements

      - name: Build and validate
        uses: w3c/spec-prod@v2.14.1
        with:
          VALIDATE_MARKUP: false
          SOURCE: requirements/index.bs

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: netwerk-digitaal-erfgoed
          repositories: netwerk-digitaal-erfgoed.github.io

      - uses: actions/checkout@v7
        with:
          repository: netwerk-digitaal-erfgoed/netwerk-digitaal-erfgoed.github.io
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/download-artifact@v8
        with:
          name: spec-prod-result-requirements
          path: artifacts/

      - name: Copy build artifacts
        run: |
          rm -rf static/requirements-datasets/
          mkdir -p static/requirements-datasets/
          cp -r artifacts/* static/requirements-datasets/
          rm -f static/requirements-datasets/.gitignore static/requirements-datasets/index.bs static/requirements-datasets/Makefile static/requirements-datasets/logo.include static/requirements-datasets/nde.include
          rm -rf static/requirements-datasets/.github
          rm -rf artifacts/
        working-directory: .

      - name: Deploy to docs.nde.nl
        uses: grafana/github-api-commit-action@v1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'deploy: ${{ github.repository }}@${{ github.sha }}'
          stage-all-files: true
          success-if-no-changes: true
